<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Chat - Femina</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica', 'Arial', sans-serif;
            height: 100vh;
            overflow: hidden;
        }

        .chat-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            background-color: #f0f2f5;
        }

        /* Header */
        .chat-header {
            background-color: #00a884;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: #d9d9d9;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }

        .contact-info h2 {
            color: white;
            font-size: 16px;
            font-weight: 500;
        }

        .contact-info p {
            color: rgba(255, 255, 255, 0.8);
            font-size: 12px;
        }

        .header-right {
            display: flex;
            gap: 20px;
        }

        .icon-btn {
            background: none;
            border: none;
            color: white;
            cursor: pointer;
            font-size: 20px;
            padding: 4px;
        }

        .icon-btn:hover {
            opacity: 0.8;
        }

        /* Messages Area */
        .messages-area {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            background-color: #efeae2;
            background-image: url('data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMjAwIiBoZWlnaHQ9IjIwMCIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48ZGVmcz48cGF0dGVybiBpZD0icGF0dGVybiIgcGF0dGVyblVuaXRzPSJ1c2VyU3BhY2VPblVzZSIgd2lkdGg9IjQwIiBoZWlnaHQ9IjQwIj48cGF0aCBkPSJNMjAgMjBMMzAgMzBNMzAgMjBMMjAgMzAiIHN0cm9rZT0iI2RkZCIgc3Ryb2tlLXdpZHRoPSIwLjUiIGZpbGw9Im5vbmUiLz48L3BhdHRlcm4+PC9kZWZzPjxyZWN0IHdpZHRoPSIxMDAlIiBoZWlnaHQ9IjEwMCUiIGZpbGw9IiNlY2U1ZGQiLz48cmVjdCB3aWR0aD0iMTAwJSIgaGVpZ2h0PSIxMDAlIiBmaWxsPSJ1cmwoI3BhdHRlcm4pIiBvcGFjaXR5PSIwLjQiLz48L3N2Zz4=');
        }

        .message-wrapper {
            display: flex;
            margin-bottom: 8px;
            align-items: flex-end;
        }

        .message-wrapper.sent {
            flex-direction: row-reverse;
        }

        .message-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background-color: #d9d9d9;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
        }

        .message-bubble {
            max-width: 65%;
            padding: 8px 12px;
            border-radius: 8px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
            position: relative;
        }

        .message-wrapper.received .message-bubble {
            background-color: white;
            margin-left: 8px;
            border-bottom-left-radius: 0;
        }

        .message-wrapper.sent .message-bubble {
            background-color: #d9fdd3;
            margin-right: 8px;
            border-bottom-right-radius: 0;
        }

        .message-text {
            font-size: 14px;
            color: #111;
            line-height: 1.4;
        }

        .message-time {
            font-size: 11px;
            color: #667781;
            text-align: right;
            margin-top: 4px;
        }

        /* Input Area */
        .input-area {
            background-color: #f0f2f5;
            padding: 8px 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .input-btn {
            background: none;
            border: none;
            color: #54656f;
            cursor: pointer;
            font-size: 24px;
            padding: 8px;
            border-radius: 50%;
        }

        .input-btn:hover {
            background-color: rgba(0,0,0,0.05);
        }

        .input-wrapper {
            flex: 1;
            background-color: white;
            border-radius: 24px;
            padding: 8px 16px;
            display: flex;
            align-items: center;
        }

        #messageInput {
            flex: 1;
            border: none;
            outline: none;
            font-size: 14px;
            font-family: inherit;
        }

        #messageInput::placeholder {
            color: #8696a0;
        }

        .send-btn {
            background-color: #00a884;
            border: none;
            color: white;
            cursor: pointer;
            font-size: 20px;
            padding: 12px;
            border-radius: 50%;
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .send-btn:hover {
            background-color: #008f6f;
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <!-- Header -->
        <div class="chat-header">
            <div class="header-left">
                <div class="avatar">👩</div>
                <div class="contact-info">
                    <h2>Femina</h2>
                    <p>online</p>
                </div>
            </div>
            <div class="header-right">
                <button class="icon-btn">📹</button>
                <button class="icon-btn">📞</button>
                <button class="icon-btn">⋮</button>
            </div>
        </div>

        <!-- Messages -->
        <div class="messages-area" id="messagesArea">
            <div class="message-wrapper received">
                <div class="message-avatar">👩</div>
                <div class="message-bubble">
                    <div class="message-text">Hey!</div>
                    <div class="message-time">10:30 AM</div>
                </div>
            </div>

            <div class="message-wrapper sent">
                <div class="message-bubble">
                    <div class="message-text">Hi there</div>
                    <div class="message-time">10:32 AM</div>
                </div>
            </div>

            <div class="message-wrapper received">
                <div class="message-avatar">👩</div>
                <div class="message-bubble">
                    <div class="message-text">What's up?</div>
                    <div class="message-time">10:33 AM</div>
                </div>
            </div>

            <div class="message-wrapper sent">
                <div class="message-bubble">
                    <div class="message-text">All good</div>
                    <div class="message-time">10:35 AM</div>
                </div>
            </div>

            <div class="message-wrapper received">
                <div class="message-avatar">👩</div>
                <div class="message-bubble">
                    <div class="message-text">Coffee?</div>
                    <div class="message-time">10:36 AM</div>
                </div>
            </div>

            <div class="message-wrapper sent">
                <div class="message-bubble">
                    <div class="message-text">Sure!</div>
                    <div class="message-time">10:37 AM</div>
                </div>
            </div>
        </div>

        <!-- Input -->
        <div class="input-area">
            <button class="input-btn">😊</button>
            <button class="input-btn">📎</button>
            <div class="input-wrapper">
                <input type="text" id="messageInput" placeholder="Type a message">
            </div>
            <button class="send-btn" id="sendBtn">➤</button>
        </div>
    </div>

    <script>
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const messagesArea = document.getElementById('messagesArea');

        function getCurrentTime() {
            const now = new Date();
            let hours = now.getHours();
            const minutes = now.getMinutes();
            const ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12;
            hours = hours ? hours : 12;
            const minutesStr = minutes < 10 ? '0' + minutes : minutes;
            return hours + ':' + minutesStr + ' ' + ampm;
        }

        function sendMessage() {
            const text = messageInput.value.trim();
            if (text) {
                const messageWrapper = document.createElement('div');
                messageWrapper.className = 'message-wrapper sent';
                
                const messageBubble = document.createElement('div');
                messageBubble.className = 'message-bubble';
                
                const messageText = document.createElement('div');
                messageText.className = 'message-text';
                messageText.textContent = text;
                
                const messageTime = document.createElement('div');
                messageTime.className = 'message-time';
                messageTime.textContent = getCurrentTime();
                
                messageBubble.appendChild(messageText);
                messageBubble.appendChild(messageTime);
                messageWrapper.appendChild(messageBubble);
                
                messagesArea.appendChild(messageWrapper);
                messageInput.value = '';
                
                messagesArea.scrollTop = messagesArea.scrollHeight;
            }
        }

        sendBtn.addEventListener('click', sendMessage);
        
        messageInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });
    </script>
</body>
</html>
